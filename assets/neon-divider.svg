<svg width="100%" height="8" viewBox="0 0 1200 8" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="15%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="35%" stop-color="#00F0FF" stop-opacity="1" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="1" />
      <stop offset="65%" stop-color="#EC4899" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background subtle glow line -->
  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#neonGrad)" stroke-width="3" filter="url(#glow)" />
  <!-- Crisp core line -->
  <line x1="0" y1="4" x2="1200" y2="4" stroke="url(#neonGrad)" stroke-width="1.5" />
  <!-- Center tech diamonds -->
  <polygon points="600,0 604,4 600,8 596,4" fill="#00F0FF" filter="url(#glow)" />
  <polygon points="560,2 562,4 560,6 558,4" fill="#A855F7" />
  <polygon points="640,2 642,4 640,6 638,4" fill="#EC4899" />
</svg>
