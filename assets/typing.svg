<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 60" width="700" height="60" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&amp;display=swap');
      
      .text-base {
        font-family: 'Fira Code', 'Courier New', monospace;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 1px;
      }

      .prefix {
        fill: #A855F7;
        font-weight: 700;
      }

      .prompt-arrow {
        fill: #EC4899;
      }

      .line {
        fill: #00F0FF;
        filter: drop-shadow(0 0 8px rgba(0, 240, 255, 0.6));
        opacity: 0;
      }

      .cursor {
        fill: #00F0FF;
        animation: blink 0.8s infinite;
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .line-1 { animation: cycle1 15s infinite; }
      .line-2 { animation: cycle2 15s infinite; }
      .line-3 { animation: cycle3 15s infinite; }
      .line-4 { animation: cycle4 15s infinite; }
      .line-5 { animation: cycle5 15s infinite; }

      @keyframes cycle1 {
        0% { opacity: 0; }
        3% { opacity: 1; }
        17% { opacity: 1; }
        20% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle2 {
        0%, 20% { opacity: 0; }
        23% { opacity: 1; }
        37% { opacity: 1; }
        40% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle3 {
        0%, 40% { opacity: 0; }
        43% { opacity: 1; }
        57% { opacity: 1; }
        60% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle4 {
        0%, 60% { opacity: 0; }
        63% { opacity: 1; }
        77% { opacity: 1; }
        80% { opacity: 0; }
        100% { opacity: 0; }
      }

      @keyframes cycle5 {
        0%, 80% { opacity: 0; }
        83% { opacity: 1; }
        97% { opacity: 1; }
        100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal badge container -->
  <rect x="2" y="5" width="696" height="50" rx="8" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Subtle inner neon accent border top -->
  <line x1="20" y1="5" x2="680" y2="5" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.4" />

  <!-- Terminal decoration dots -->
  <circle cx="24" cy="30" r="4.5" fill="#EF4444" opacity="0.8" />
  <circle cx="39" cy="30" r="4.5" fill="#F59E0B" opacity="0.8" />
  <circle cx="54" cy="30" r="4.5" fill="#10B981" opacity="0.8" />

  <!-- Static Terminal Prompt -->
  <text x="80" y="37" class="text-base prompt-arrow">❯</text>
  <text x="96" y="37" class="text-base prefix">ai.profile</text>
  <text x="210" y="37" class="text-base" fill="#64748B">:</text>
  <text x="222" y="37" class="text-base" fill="#38BDF8">~</text>
  <text x="238" y="37" class="text-base prompt-arrow">$</text>

  <!-- Animated Rotating Text Lines -->
  <text x="260" y="37" class="text-base line line-1">AI &amp; Data Science Student</text>
  <text x="260" y="37" class="text-base line line-2">Aspiring Data Scientist</text>
  <text x="260" y="37" class="text-base line line-3">Developer &amp; Problem Solver</text>
  <text x="260" y="37" class="text-base line line-4">Exploring Artificial Intelligence</text>
  <text x="260" y="37" class="text-base line line-5">Building Projects That Matter</text>

  <!-- Blinking Cursor -->
  <rect x="660" y="20" width="3" height="20" class="cursor" />
</svg>
